  <style>
    body{min-height:100vh;min-height:100dvh;display:grid;place-items:center;background:#eef4f1;padding:24px 16px}
    .donation-page{width:100%;max-width:650px;background:#fff;border:1px solid #dce6e1;border-radius:24px;overflow:hidden;box-shadow:0 16px 48px -30px rgba(10,43,44,.25)}
    .donation-page-head{padding:28px 24px 0;text-align:center}
    .donation-page-head img{width:68px;height:68px;object-fit:cover;border-radius:50%;margin:0 auto 12px}
    .donation-page-head h1{font-size:1.6rem;color:#12393e;line-height:1.3}
    .donation-page-head p{font-size:.85rem;margin-top:6px;color:#526b68}
    .donation-page .donation-account{border:0;box-shadow:none;border-radius:0}
    .donation-page .donation-copy-btn{opacity:1;transform:none;visibility:visible}
    .donation-page .donation-iban{font-size:clamp(.75rem,3.2vw,.94rem)}
    .donation-page-footer{padding:0 24px 24px}
    .donation-home{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:48px;padding:12px 20px;border:1px solid #cbded7;border-radius:999px;color:#115e59;background:#f5faf8;font-weight:700;font-size:.9rem;text-decoration:none;transition:background .2s ease}
    .donation-home:hover{background:#e7f4f1}
    .donation-home:focus-visible{outline:2px solid #0f766e;outline-offset:4px}
  </style>
  <script src="/assets/js/donation.js?v=20260923-copy-icons" defer></script>

<body>
  <main class="donation-page" aria-labelledby="support-title">
    <header class="donation-page-head">
      <img src="/assets/img/logo.jpg" width="68" height="68" alt="BAY-DER logosu">
      <h1 id="support-title">Bağış ve Destek</h1>
      <p>Birlikte daha güçlüyüz.</p>
    </header>
        <div class="donation-account">
          <div class="donation-details">
            <p class="donation-label">Hesap sahibi</p>
            <div class="donation-copy-row">
              <p class="donation-owner" id="donation-owner">ANKARA DOĞUBAYAZITLILAR KÜLTÜR VE DAYANIŞMA DERNEĞİ</p>
              <button class="donation-copy-icon" type="button" data-copy-target="donation-owner" data-copy-label="Hesap adı" aria-label="Hesap adını kopyala" title="Hesap adını kopyala" hidden><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h3"/></svg></button>
            </div>
            <p class="donation-label">IBAN</p>
            <div class="donation-copy-row">
              <p id="donation-iban" class="donation-iban">TR94 0001 0021 5098 3859 4250 01</p>
              <button class="donation-copy-icon" type="button" data-copy-target="donation-iban" data-copy-label="IBAN" aria-label="IBAN’ı kopyala" title="IBAN’ı kopyala" hidden><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h3"/></svg></button>
            </div>
            <p class="donation-status" id="donation-status" role="status" aria-live="polite"></p>
          </div>
          <figure class="donation-qr">
            <img src="/assets/img/bagis-iban-qr.svg" width="180" height="180" loading="lazy" alt="Dernek IBAN bilgisini içeren QR kod">
            <figcaption>IBAN için okutun</figcaption>
            <a href="/assets/img/bagis-iban-qr.svg" download="BAY-DER-IBAN-QR.svg">QR kodu indir</a>
          </figure>
          <p class="donation-note">QR kod yalnızca IBAN bilgisini içerir. Havale/EFT yaparken alıcı adını kontrol edin.</p>
        </div>
    <footer class="donation-page-footer">
      <a class="donation-home" href="/"><span aria-hidden="true">←</span> Ana sayfaya dön</a>
    </footer>
  </main>
</body>
</html>
